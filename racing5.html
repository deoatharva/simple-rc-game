<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Racer - Visual Polish & Curves</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
    canvas { display: block; }
    #hud {
      position: absolute; top: 16px; left: 16px;
      font: 16px/1.4 monospace; color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,.8);
      pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 12px; border-radius: 8px;
    }
    .warning { color: #ff4444; font-weight: bold; display: none; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="hud">
    <div>Speed: <span id="speed">0</span> km/h</div>
    <div>Lap Time: <span id="lap-time">0.00</span>s</div>
    <div>Best Lap: <span id="best-time">--.--</span>s</div>
    <div>Next Checkpoint: <span id="cp-count">Start Line</span></div>
    <div id="offroad-warning" class="warning">OFF TRACK!</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Renderer / Scene / Camera ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // Nicer sky color
    scene.background = new THREE.Color(0x87ceeb); 
    // Heavy fog for depth
    scene.fog = new THREE.Fog(0x87ceeb, 50, 180); 

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 500);

    // ---------- Lights ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(40, 80, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    // Expand shadow camera to cover more of the track
    const s = 150;
    sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
    sun.shadow.camera.top = s;   sun.shadow.camera.bottom = -s;
    sun.shadow.camera.far = 300;
    scene.add(sun);

    // ---------- Ground ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(500, 500),
      new THREE.MeshStandardMaterial({ color: 0x3a7d44 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---------- Trees (Visual Polish) ----------
    function createTree(x, z) {
      const tree = new THREE.Group();
      // Trunk
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.4, 2, 6),
        new THREE.MeshStandardMaterial({ color: 0x5c4033 })
      );
      trunk.position.y = 1;
      trunk.castShadow = true;
      tree.add(trunk);
      // Leaves
      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.5, 3, 6),
        new THREE.MeshStandardMaterial({ color: 0x2d6a4f })
      );
      leaves.position.y = 3;
      leaves.castShadow = true;
      tree.add(leaves);
      
      tree.position.set(x, 0, z);
      scene.add(tree);
    }

    // Scatter trees randomly outside the track
    for(let i=0; i<100; i++) {
      let x, z;
      // Keep trees away from the central track area
      do {
        x = (Math.random() - 0.5) * 300;
        z = (Math.random() - 0.5) * 300;
      } while (Math.abs(x) < 60 && Math.abs(z) < 60);
      createTree(x, z);
    }

    // ---------- The Track ----------
    const trackGroup = new THREE.Group();
    scene.add(trackGroup);
    
    const trackSegments = []; 
    const wallMeshes = []; 

    const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const wallMatRed = new THREE.MeshStandardMaterial({ color: 0xd62828 });
    const wallMatWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });

    // We use a helper to build smooth curves!
    function addCurvedSegment(x, z, radius, startAngle, endAngle, isCenterX = true) {
      // 1. Asphalt
      const geo = new THREE.RingGeometry(radius - 6, radius + 6, 32, 1, startAngle, endAngle - startAngle);
      const mesh = new THREE.Mesh(geo, asphaltMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, 0.02, z);
      mesh.receiveShadow = true;
      trackGroup.add(mesh);

      // 2. Edge Lines (Approximated for curves for simplicity)
      // (We skip exact line curves for now to keep code small, but the track is smooth)

      // 3. Curved Walls
      const wallThickness = 0.8;
      const wallHeight = 1.2;
      
      // Inner and Outer wall radii
      const rInner = radius - 6 - wallThickness/2;
      const rOuter = radius + 6 + wallThickness/2;
      const numSegments = 16;
      const angleStep = (endAngle - startAngle) / numSegments;

      for (let i = 0; i < numSegments; i++) {
        const a1 = startAngle + i * angleStep;
        const a2 = a1 + angleStep;
        const midAngle = (a1 + a2) / 2;
        
        // Inner Wall
        const innerWall = new THREE.Mesh(
          new THREE.BoxGeometry(wallThickness, wallHeight, 2.5),
          i % 2 === 0 ? wallMatRed : wallMatWhite
        );
        innerWall.position.set(x + rInner * Math.cos(midAngle), wallHeight/2, z + rInner * Math.sin(midAngle));
        innerWall.rotation.y = -midAngle + Math.PI/2;
        innerWall.castShadow = true;
        scene.add(innerWall);
        innerWall.updateMatrixWorld();
        wallMeshes.push(innerWall);

        // Outer Wall
        const outerWall = new THREE.Mesh(
          new THREE.BoxGeometry(wallThickness, wallHeight, 2.5),
          i % 2 === 0 ? wallMatWhite : wallMatRed
        );
        outerWall.position.set(x + rOuter * Math.cos(midAngle), wallHeight/2, z + rOuter * Math.sin(midAngle));
        outerWall.rotation.y = -midAngle + Math.PI/2;
        outerWall.castShadow = true;
        scene.add(outerWall);
        outerWall.updateMatrixWorld();
        wallMeshes.push(outerWall);
      }
    }

    function addStraightSegment(x, z, width, length, rotationY = 0) {
      // 1. Asphalt
      const geo = new THREE.PlaneGeometry(width, length);
      const mesh = new THREE.Mesh(geo, asphaltMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.rotation.z = rotationY;
      mesh.position.set(x, 0.02, z); 
      mesh.receiveShadow = true;
      trackGroup.add(mesh);

      trackSegments.push({ x, z, width, length, rotation: rotationY });

      // 2. White Edge Lines
      const lineGeo = new THREE.PlaneGeometry(0.5, length);
      const leftLine = new THREE.Mesh(lineGeo, lineMat);
      leftLine.rotation.x = -Math.PI / 2;
      leftLine.rotation.z = rotationY;
      leftLine.position.set(x + Math.cos(rotationY) * (width/2 - 0.25), 0.03, z - Math.sin(rotationY) * (width/2 - 0.25));
      trackGroup.add(leftLine);

      const rightLine = new THREE.Mesh(lineGeo, lineMat);
      rightLine.rotation.x = -Math.PI / 2;
      rightLine.rotation.z = rotationY;
      rightLine.position.set(x - Math.cos(rotationY) * (width/2 - 0.25), 0.03, z + Math.sin(rotationY) * (width/2 - 0.25));
      trackGroup.add(rightLine);

      // 3. Walls
      const wallThickness = 0.8;
      const wallHeight = 1.2;
      const numStripes = Math.ceil(length / 4); 
      const stripeLength = length / numStripes;

      const wallDefs = [
        { offset: width / 2 + wallThickness / 2 },
        { offset: -width / 2 - wallThickness / 2 }
      ];

      wallDefs.forEach(def => {
        const wallSideGroup = new THREE.Group();
        wallSideGroup.rotation.y = rotationY;
        const localX = def.offset;
        wallSideGroup.position.set(
          x + localX * Math.cos(rotationY),
          wallHeight / 2,
          z - localX * Math.sin(rotationY)
        );
        scene.add(wallSideGroup);

        for (let i = 0; i < numStripes; i++) {
          const isRed = i % 2 === 0;
          const stripeGeo = new THREE.BoxGeometry(wallThickness, wallHeight, stripeLength);
          const stripe = new THREE.Mesh(stripeGeo, isRed ? wallMatRed : wallMatWhite);
          stripe.position.z = -length / 2 + (i * stripeLength) + (stripeLength / 2);
          stripe.castShadow = true;
          stripe.receiveShadow = true;
          wallSideGroup.add(stripe);
        }

        const colGeo = new THREE.BoxGeometry(wallThickness, wallHeight, length);
        const colBox = new THREE.Mesh(colGeo, new THREE.MeshBasicMaterial({visible: false}));
        wallSideGroup.add(colBox);
        wallSideGroup.updateMatrixWorld();
        wallMeshes.push(colBox);
      });
    }

    // --- Build the Track (Oval Shape) ---
    const TRACK_RADIUS = 40;
    const STRAIGHT_LEN = 60;
    const TRACK_WIDTH = 14;

    // Straights (Top and Bottom)
    addStraightSegment(0, STRAIGHT_LEN/2, TRACK_WIDTH, STRAIGHT_LEN, 0);
    addStraightSegment(0, -STRAIGHT_LEN/2, TRACK_WIDTH, STRAIGHT_LEN, 0);
    
    // Save straight track segments for offroad detection
    // (Top)
    trackSegments.push({ x: 0, z: STRAIGHT_LEN/2, width: TRACK_WIDTH, length: STRAIGHT_LEN, rotation: 0 });
    // (Bottom)
    trackSegments.push({ x: 0, z: -STRAIGHT_LEN/2, width: TRACK_WIDTH, length: STRAIGHT_LEN, rotation: 0 });

    // Curves (Left and Right)
    // Right curve
    addCurvedSegment(0, STRAIGHT_LEN/2, TRACK_RADIUS, -Math.PI/2, 0);
    // Left curve
    addCurvedSegment(0, STRAIGHT_LEN/2, TRACK_RADIUS, Math.PI, Math.PI*1.5);

    // --- Start/Finish Line Checkerboard ---
    const checkGeo = new THREE.PlaneGeometry(TRACK_WIDTH, 2);
    const checkMat = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true });
    const startLine = new THREE.Mesh(new THREE.BoxGeometry(TRACK_WIDTH, 0.1, 2), new THREE.MeshStandardMaterial({color: 0xdddddd}));
    startLine.position.set(0, 0.04, -STRAIGHT_LEN/2);
    scene.add(startLine);

    // ---------- Checkpoints ----------
    const checkpoints = [
      { x: 0, z: -STRAIGHT_LEN/2, r: 10 }, // Start/Finish
      { x: 0, z: STRAIGHT_LEN/2, r: 10 },  // Top Straight
      { x: 0, z: STRAIGHT_LEN/2, r: 10 },  // Top Curve
      { x: 0, z: -STRAIGHT_LEN/2, r: 10 }  // Bottom Curve
    ];

    const cpVisuals = [];
    checkpoints.forEach((cp, i) => {
      const geo = new THREE.RingGeometry(cp.r - 1, cp.r, 32);
      const mat = new THREE.MeshBasicMaterial({ 
        color: i === 0 ? 0xffaa00 : 0x00aaff, 
        side: THREE.DoubleSide, 
        transparent: true, 
        opacity: 0.3 
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(cp.x, 0.05, cp.z);
      scene.add(mesh);
      cpVisuals.push(mesh);
    });

    // ---------- Car ----------
    const car = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 3.2), new THREE.MeshStandardMaterial({ color: 0xe63946 }));
    body.position.y = 0.6; body.castShadow = true; car.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 1.6), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    cabin.position.set(0, 1.1, -0.2); cabin.castShadow = true; car.add(cabin);

    const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    
    // Store wheels so we can steer them visually
    const wheels = [];
    [[ 0.85, 0.35, 1.0], [-0.85, 0.35, 1.0], [ 0.85, 0.35, -1.0], [-0.85, 0.35, -1.0]].forEach(([x, y, z]) => {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2; w.position.set(x, y, z); w.castShadow = true; 
      car.add(w);
      wheels.push(w);
    });

    car.position.set(0, 0, -STRAIGHT_LEN/2);
    scene.add(car);

    // ---------- Input ----------
    const keys = {};
    addEventListener('keydown', e => keys[e.code] = true);
    addEventListener('keyup',   e => keys[e.code] = false);

    // ---------- Game State ----------
    const physics = {
      position: new THREE.Vector3(0, 0, -STRAIGHT_LEN/2),
      heading: 0, speed: 0, isOffroad: false,
      steer: 0 // For visual wheel tilt
    };

    let currentCheckpoint = 1; 
    let hasStartedLap = false; 
    let lapStartTime = performance.now();
    let bestLapTime = null;
    let currentLapTime = 0;

    const BASE_MAX_SPEED     = 45; 
    const OFFROAD_MAX_SPEED  = 15; 
    const REVERSE_SPEED      = 12;
    const ACCEL              = 30;
    const OFFROAD_ACCEL      = 15;
    const BRAKE              = 50;
    const DRAG               = 6;
    const TURN_RATE          = 2.2;

    function checkOffroad(pos) {
      const margin = 0.5;
      for (const seg of trackSegments) {
        const dx = pos.x - seg.x;
        const dz = pos.z - seg.z;
        const cos = Math.cos(-seg.rotation);
        const sin = Math.sin(-seg.rotation);
        const localX = dx * cos - dz * sin;
        const localZ = dx * sin + dz * cos;
        if (Math.abs(localX) <= (seg.width / 2) + margin && Math.abs(localZ) <= (seg.length / 2) + margin) {
          return false;
        }
      }
      return true;
    }

    const carRadius = 1.5;
    function resolveWallCollisions() {
      let collided = false;
      for (const wall of wallMeshes) {
        const carPos = physics.position;
        const box = new THREE.Box3().setFromObject(wall);
        const closest = box.clampPoint(carPos, new THREE.Vector3());
        const dist = carPos.distanceTo(closest);
        
        if (dist < carRadius) {
          collided = true;
          const pushDir = carPos.clone().sub(closest).normalize();
          if(pushDir.lengthSq() === 0) pushDir.set(0, 0, 1);
          const overlap = carRadius - dist;
          physics.position.addScaledVector(pushDir, overlap);
          physics.speed *= 0.2; 
        }
      }
      if (collided) car.position.copy(physics.position);
    }

    function updatePhysics(dt) {
      const forward = keys['KeyW'] || keys['ArrowUp'];
      const back    = keys['KeyS'] || keys['ArrowDown'];
      const left    = keys['KeyA'] || keys['ArrowLeft'];
      const right   = keys['KeyD'] || keys['ArrowRight'];
      const brake   = keys['Space'];

      physics.isOffroad = checkOffroad(physics.position);
      const maxSpeed = physics.isOffroad ? OFFROAD_MAX_SPEED : BASE_MAX_SPEED;
      const accel = physics.isOffroad ? OFFROAD_ACCEL : ACCEL;

      if (forward) physics.speed += accel * dt;
      else if (back) {
        if (physics.speed > 0) physics.speed -= BRAKE * dt;
        else physics.speed -= accel * 0.6 * dt;
      }

      if (brake) physics.speed -= Math.sign(physics.speed) * BRAKE * dt;
      if (!forward && !back) {
        const d = DRAG * dt;
        if (Math.abs(physics.speed) <= d) physics.speed = 0;
        else physics.speed -= Math.sign(physics.speed) * d;
      }

      physics.speed = THREE.MathUtils.clamp(physics.speed, -REVERSE_SPEED, maxSpeed);

      const speedFactor = Math.min(Math.abs(physics.speed) / 6, 1);
      const highSpeedDamp = 1 - Math.min(Math.abs(physics.speed) / BASE_MAX_SPEED, 1) * 0.5;
      
      // Calculate steering input
      let targetSteer = 0;
      if (left)  targetSteer = 1;
      if (right) targetSteer = -1;
      physics.steer = THREE.MathUtils.lerp(physics.steer, targetSteer, 10 * dt); // Smooth visual steer

      if (left)  physics.heading += TURN_RATE * speedFactor * highSpeedDamp * dt * Math.sign(physics.speed);
      if (right) physics.heading -= TURN_RATE * speedFactor * highSpeedDamp * dt * Math.sign(physics.speed);

      const dir = new THREE.Vector3(Math.sin(physics.heading), 0, Math.cos(physics.heading));
      physics.position.addScaledVector(dir, physics.speed * dt);

      resolveWallCollisions();

      car.position.copy(physics.position);
      car.rotation.y = physics.heading;
      
      // Visual Polish: Tilt car body when turning
      const leanAmount = (physics.speed / BASE_MAX_SPEED) * physics.steer * 0.15;
      car.rotation.z = -leanAmount;

      // Visual Polish: Turn front wheels
      wheels[0].rotation.y = physics.steer * 0.5;
      wheels[1].rotation.y = physics.steer * 0.5;
    }

    function updateCheckpoints(dt) {
      const cp = checkpoints[currentCheckpoint];
      const dist = physics.position.distanceTo(new THREE.Vector3(cp.x, 0, cp.z));

      if (dist < cp.r) {
        if (currentCheckpoint === 0) {
          if (hasStartedLap) {
            currentLapTime = (performance.now() - lapStartTime) / 1000;
            if (bestLapTime === null || currentLapTime < bestLapTime) {
              bestLapTime = currentLapTime;
              document.getElementById('best-time').textContent = bestLapTime.toFixed(2);
            }
          }
          hasStartedLap = true;
          lapStartTime = performance.now();
        }

        currentCheckpoint = (currentCheckpoint + 1) % checkpoints.length;
        cpVisuals.forEach((v, i) => {
          v.material.color.set(i === currentCheckpoint ? 0x00ff00 : (i === 0 ? 0xffaa00 : 0x00aaff));
        });
        document.getElementById('cp-count').textContent = 
          currentCheckpoint === 0 ? "Start Line" : `Checkpoint ${currentCheckpoint}`;
      }

      if (hasStartedLap) {
        currentLapTime = (performance.now() - lapStartTime) / 1000;
      }
    }

    const camTarget = new THREE.Vector3();
    const camDesired = new THREE.Vector3();
    // Dynamic camera distance based on speed for a sense of velocity
    const CAM_HEIGHT   = 4;
    const CAM_LERP     = 5; 

    function updateCamera(dt) {
      const speedRatio = Math.abs(physics.speed) / BASE_MAX_SPEED;
      const distance = 7 + (speedRatio * 2); // Pull back slightly at high speed
      
      const behind = new THREE.Vector3(-Math.sin(physics.heading), 0, -Math.cos(physics.heading));
      camDesired.copy(physics.position).addScaledVector(behind, distance).add(new THREE.Vector3(0, CAM_HEIGHT, 0));
      
      const t = 1 - Math.exp(-CAM_LERP * dt); 
      camera.position.lerp(camDesired, t);
      
      camTarget.copy(physics.position).add(new THREE.Vector3(0, 1, 0));
      camera.lookAt(camTarget);
    }

    const speedEl = document.getElementById('speed');
    const lapTimeEl = document.getElementById('lap-time');
    const warningEl = document.getElementById('offroad-warning');

    function updateHUD() {
      speedEl.textContent = Math.round(Math.abs(physics.speed) * 3.6);
      lapTimeEl.textContent = currentLapTime.toFixed(2);
      warningEl.style.display = physics.isOffroad ? 'block' : 'none';
    }

    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      updatePhysics(dt);
      updateCheckpoints(dt);
      updateCamera(dt);
      updateHUD();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
