<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Racer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
    canvas { display: block; }
    #hud {
      position: absolute; top: 16px; left: 16px;
      font: 16px/1.4 monospace; color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,.6);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>Speed: <span id="speed">0</span> km/h</div>
  </div>

  <!-- Three.js from CDN (ES modules) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Renderer / Scene / Camera ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 60, 200);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);

    // ---------- Lights ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));

    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(30, 60, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const s = 60;
    sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
    sun.shadow.camera.top = s;   sun.shadow.camera.bottom = -s;
    sun.shadow.camera.far = 200;
    scene.add(sun);

    // ---------- Ground ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 400),
      new THREE.MeshStandardMaterial({ color: 0x3a7d44 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // A grid so you can feel motion
    const grid = new THREE.GridHelper(400, 80, 0x2b5c33, 0x2b5c33);
    grid.position.y = 0.01;
    scene.add(grid);

    // ---------- Car ----------
    const car = new THREE.Group();

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 0.6, 3.2),
      new THREE.MeshStandardMaterial({ color: 0xe63946 })
    );
    body.position.y = 0.6;
    body.castShadow = true;
    car.add(body);

    const cabin = new THREE.Mesh(
      new THREE.BoxGeometry(1.3, 0.5, 1.6),
      new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    cabin.position.set(0, 1.1, -0.2);
    cabin.castShadow = true;
    car.add(cabin);

    // Wheels (visual only for now)
    const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const wheelPositions = [
      [ 0.85, 0.35,  1.0],
      [-0.85, 0.35,  1.0],
      [ 0.85, 0.35, -1.0],
      [-0.85, 0.35, -1.0],
    ];
    for (const [x, y, z] of wheelPositions) {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2;
      w.position.set(x, y, z);
      w.castShadow = true;
      car.add(w);
    }

    car.position.set(0, 0, 0);
    scene.add(car);

    // ---------- Input ----------
    const keys = {};
    addEventListener('keydown', e => keys[e.code] = true);
    addEventListener('keyup',   e => keys[e.code] = false);

    // ---------- Car physics state ----------
    const physics = {
      position: new THREE.Vector3(0, 0, 0),
      heading: 0,       // radians (yaw)
      speed: 0,         // units/sec along heading
    };

    const MAX_SPEED      = 40;    // forward units/sec
    const REVERSE_SPEED  = 12;
    const ACCEL          = 28;    // units/sec^2
    const BRAKE          = 45;
    const DRAG           = 6;     // passive slowdown
    const TURN_RATE      = 2.2;   // radians/sec at full speed

    function updatePhysics(dt) {
      const forward = keys['KeyW'] || keys['ArrowUp'];
      const back    = keys['KeyS'] || keys['ArrowDown'];
      const left    = keys['KeyA'] || keys['ArrowLeft'];
      const right   = keys['KeyD'] || keys['ArrowRight'];
      const brake   = keys['Space'];

      // Acceleration / braking
      if (forward) physics.speed += ACCEL * dt;
      else if (back) {
        // Brake if moving forward, else reverse
        if (physics.speed > 0) physics.speed -= BRAKE * dt;
        else physics.speed -= ACCEL * 0.6 * dt;
      }

      if (brake) physics.speed -= Math.sign(physics.speed) * BRAKE * dt;

      // Passive drag
      if (!forward && !back) {
        const d = DRAG * dt;
        if (Math.abs(physics.speed) <= d) physics.speed = 0;
        else physics.speed -= Math.sign(physics.speed) * d;
      }

      // Clamp
      physics.speed = THREE.MathUtils.clamp(physics.speed, -REVERSE_SPEED, MAX_SPEED);

      // Steering — only effective when moving, scaled down at high speed
      const speedFactor = Math.min(Math.abs(physics.speed) / 6, 1);
      const highSpeedDamp = 1 - Math.min(Math.abs(physics.speed) / MAX_SPEED, 1) * 0.5;
      if (left)  physics.heading += TURN_RATE * speedFactor * highSpeedDamp * dt * Math.sign(physics.speed);
      if (right) physics.heading -= TURN_RATE * speedFactor * highSpeedDamp * dt * Math.sign(physics.speed);

      // Integrate position
      const dir = new THREE.Vector3(
        Math.sin(physics.heading),
        0,
        Math.cos(physics.heading)
      );
      physics.position.addScaledVector(dir, physics.speed * dt);

      // Apply to mesh
      car.position.copy(physics.position);
      car.rotation.y = physics.heading;
    }

    // ---------- Chase camera ----------
    const camTarget = new THREE.Vector3();
    const camDesired = new THREE.Vector3();
    const CAM_DISTANCE = 8;
    const CAM_HEIGHT   = 4;
    const CAM_LERP     = 5; // smoothing

    function updateCamera(dt) {
      // Desired camera position: behind the car
      const behind = new THREE.Vector3(
        -Math.sin(physics.heading),
        0,
        -Math.cos(physics.heading)
      );
      camDesired.copy(physics.position)
        .addScaledVector(behind, CAM_DISTANCE)
        .add(new THREE.Vector3(0, CAM_HEIGHT, 0));

      const t = 1 - Math.exp(-CAM_LERP * dt); // frame-rate independent lerp
      camera.position.lerp(camDesired, t);

      camTarget.copy(physics.position).add(new THREE.Vector3(0, 1, 0));
      camera.lookAt(camTarget);
    }

    // ---------- HUD ----------
    const speedEl = document.getElementById('speed');

    function updateHUD() {
      // Arbitrary scale so it "feels" like km/h
      speedEl.textContent = Math.round(Math.abs(physics.speed) * 3.6);
    }

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05); // clamp to avoid huge steps

      updatePhysics(dt);
      updateCamera(dt);
      updateHUD();

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // ---------- Resize ----------
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
