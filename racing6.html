<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Racer - Fixed Circuit</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; }
    canvas { display: block; }
    #hud {
      position: absolute; top: 16px; left: 16px;
      font: 16px/1.4 monospace; color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,.8);
      pointer-events: none;
      background: rgba(0,0,0,0.4);
      padding: 12px; border-radius: 8px;
    }
    .warning { color: #ff4444; font-weight: bold; display: none; margin-top: 8px; }
    .help { font-size: 12px; color: #aaa; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="hud">
    <div>Speed: <span id="speed">0</span> km/h</div>
    <div>Lap Time: <span id="lap-time">0.00</span>s</div>
    <div>Best Lap: <span id="best-time">--.--</span>s</div>
    <div>Next Checkpoint: <span id="cp-count">Start Line</span></div>
    <div id="offroad-warning" class="warning">OFF TRACK!</div>
    <div class="help">Press [R] to Respawn</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Renderer / Scene / Camera ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); 
    scene.fog = new THREE.Fog(0x87ceeb, 60, 200); 

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);

    // ---------- Lights ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.position.set(40, 80, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const s = 150;
    sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
    sun.shadow.camera.top = s;   sun.shadow.camera.bottom = -s;
    sun.shadow.camera.far = 300;
    scene.add(sun);

    // ---------- Ground & Trees ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(500, 500),
      new THREE.MeshStandardMaterial({ color: 0x3a7d44 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    function createTree(x, z) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 6), new THREE.MeshStandardMaterial({ color: 0x5c4033 }));
      trunk.position.y = 1; trunk.castShadow = true; tree.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 6), new THREE.MeshStandardMaterial({ color: 0x2d6a4f }));
      leaves.position.y = 3; leaves.castShadow = true; tree.add(leaves);
      tree.position.set(x, 0, z);
      scene.add(tree);
    }

    for(let i=0; i<150; i++) {
      let x, z;
      do {
        x = (Math.random() - 0.5) * 350;
        z = (Math.random() - 0.5) * 350;
      } while (Math.abs(x) < 70 && Math.abs(z) < 70); // Keep center clear for track
      createTree(x, z);
    }

    // ---------- The Track System (Using Curves) ----------
    const trackWidth = 14;
    const trackGroup = new THREE.Group();
    scene.add(trackGroup);
    
    const wallMeshes = []; // Store walls for collision
    let trackPath; // Store the mathematical path for respawning

    // Define control points for a smooth loop
    const points = [
      new THREE.Vector3(0, 0, -50),  // Start/Finish
      new THREE.Vector3(40, 0, -50), 
      new THREE.Vector3(60, 0, -20), 
      new THREE.Vector3(60, 0, 20),  
      new THREE.Vector3(40, 0, 50),  
      new THREE.Vector3(0, 0, 50),   
      new THREE.Vector3(-40, 0, 50), 
      new THREE.Vector3(-60, 0, 20), 
      new THREE.Vector3(-60, 0, -20),
      new THREE.Vector3(-40, 0, -50), 
    ];

    trackPath = new THREE.CatmullRomCurve3(points, true); // true = closed loop
    trackPath.curveType = 'catmullrom';
    trackPath.tension = 0.5; 

    const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const wallMatRed = new THREE.MeshStandardMaterial({ color: 0xd62828 });
    const wallMatWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });

    // How many segments to build the track
    const numSegments = 200;
    
    // We will build the track by stepping along the curve
    for (let i = 0; i < numSegments; i++) {
      const t1 = i / numSegments;
      const t2 = (i + 1) / numSegments;
      
      const p1 = trackPath.getPointAt(t1);
      const p2 = trackPath.getPointAt(t2);
      
      const dx = p2.x - p1.x;
      const dz = p2.z - p1.z;
      const segmentLength = Math.sqrt(dx*dx + dz*dz);
      const angle = Math.atan2(dx, dz); // Direction of the track

      // 1. Asphalt
      const geo = new THREE.PlaneGeometry(trackWidth, segmentLength + 0.1); // +0.1 to prevent tiny gaps
      const mesh = new THREE.Mesh(geo, asphaltMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.rotation.z = -angle; // Rotate to face along curve
      mesh.position.set((p1.x+p2.x)/2, 0.02, (p1.z+p2.z)/2);
      mesh.receiveShadow = true;
      trackGroup.add(mesh);

      // 2. White edge lines
      const lineGeo = new THREE.PlaneGeometry(0.5, segmentLength + 0.1);
      [-1, 1].forEach(side => {
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.rotation.z = -angle;
        
        // Calculate perpendicular offset
        const perpX = Math.cos(angle) * (trackWidth/2 - 0.25) * side;
        const perpZ = -Math.sin(angle) * (trackWidth/2 - 0.25) * side;
        
        line.position.set((p1.x+p2.x)/2 + perpX, 0.03, (p1.z+p2.z)/2 + perpZ);
        trackGroup.add(line);
      });

      // 3. Walls & Collision Boxes
      const wallThickness = 1;
      const wallHeight = 1.5;
      
      [-1, 1].forEach(side => {
        // Visual Wall
        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(wallThickness, wallHeight, segmentLength + 0.1),
          i % 2 === 0 ? wallMatRed : wallMatWhite
        );
        wall.rotation.y = angle;
        
        const perpX = Math.cos(angle) * (trackWidth/2 + wallThickness/2) * side;
        const perpZ = -Math.sin(angle) * (trackWidth/2 + wallThickness/2) * side;
        
        wall.position.set((p1.x+p2.x)/2 + perpX, wallHeight/2, (p1.z+p2.z)/2 + perpZ);
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
        
        // Invisible Collision Box
        wall.updateMatrixWorld();
        const box = new THREE.Box3().setFromObject(wall);
        wallMeshes.push(box); // Store bounding box directly for speed
      });
    }

    // ---------- Start/Finish Line Checkerboard ----------
    const startPos = trackPath.getPointAt(0);
    const startTan = trackPath.getTangentAt(0);
    const startAngle = Math.atan2(startTan.x, startTan.z);
    
    // Create a checkerboard texture using Canvas
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    for(let x=0; x<64; x+=16) {
      for(let y=0; y<64; y+=16) {
        ctx.fillStyle = (x/16 + y/16) % 2 === 0 ? '#fff' : '#000';
        ctx.fillRect(x, y, 16, 16);
      }
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(trackWidth / 2, 1);

    const startLine = new THREE.Mesh(
      new THREE.PlaneGeometry(trackWidth, 3), 
      new THREE.MeshStandardMaterial({ map: texture })
    );
    startLine.rotation.x = -Math.PI / 2;
    startLine.rotation.z = -startAngle;
    startLine.position.set(startPos.x, 0.05, startPos.z);
    scene.add(startLine);

    // ---------- Checkpoints ----------
    // We place them at specific points along the curve path (0.0, 0.25, 0.5, 0.75)
    const checkpoints = [
      { pos: trackPath.getPointAt(0.0), r: 10 },   // Start
      { pos: trackPath.getPointAt(0.25), r: 10 },  // Top
      { pos: trackPath.getPointAt(0.5), r: 10 },   // Far left
      { pos: trackPath.getPointAt(0.75), r: 10 },  // Bottom
    ];

    const cpVisuals = [];
    checkpoints.forEach((cp, i) => {
      const geo = new THREE.RingGeometry(cp.r - 1, cp.r, 32);
      const mat = new THREE.MeshBasicMaterial({ 
        color: i === 0 ? 0xffaa00 : 0x00aaff, 
        side: THREE.DoubleSide, 
        transparent: true, 
        opacity: 0.3 
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(cp.pos.x, 0.06, cp.pos.z);
      scene.add(mesh);
      cpVisuals.push(mesh);
    });

    // ---------- Car ----------
    const car = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 3.2), new THREE.MeshStandardMaterial({ color: 0xe63946 }));
    body.position.y = 0.6; body.castShadow = true; car.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 1.6), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    cabin.position.set(0, 1.1, -0.2); cabin.castShadow = true; car.add(cabin);

    const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const wheels = [];
    [[ 0.85, 0.35, 1.0], [-0.85, 0.35, 1.0], [ 0.85, 0.35, -1.0], [-0.85, 0.35, -1.0]].forEach(([x, y, z]) => {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.rotation.z = Math.PI / 2; w.position.set(x, y, z); w.castShadow = true; 
      car.add(w);
      wheels.push(w);
    });

    scene.add(car);

    // ---------- Input ----------
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyR') respawnCar();
    });
    addEventListener('keyup',   e => keys[e.code] = false);

    // ---------- Game State ----------
    const physics = {
      position: new THREE.Vector3(),
      heading: 0, speed: 0, isOffroad: false, steer: 0
    };

    function respawnCar() {
      // Find closest point on the track to respawn
      let closestT = 0;
      let minDist = Infinity;
      for(let t=0; t<=1; t+=0.01) {
        const p = trackPath.getPointAt(t);
        const d = p.distanceToSquared(physics.position);
        if(d < minDist) { minDist = d; closestT = t; }
      }
      
      const p = trackPath.getPointAt(closestT);
      const tan = trackPath.getTangentAt(closestT);
      
      physics.position.copy(p);
      physics.heading = Math.atan2(tan.x, tan.z);
      physics.speed = 0;
      physics.isOffroad = false;
    }

    // Start at track point 0
    respawnCar();

    let currentCheckpoint = 1; 
    let hasStartedLap = false; 
    let lapStartTime = performance.now();
    let bestLapTime = null;
    let currentLapTime = 0;

    const BASE_MAX_SPEED     = 45; 
    const OFFROAD_MAX_SPEED  = 15; 
    const REVERSE_SPEED      = 12;
    const ACCEL              = 30;
    const OFFROAD_ACCEL      = 15;
    const BRAKE              = 50;
    const DRAG               = 6;
    const TURN_RATE          = 2.2;

    // ---------- Physics & Collision ----------
    // Raycast down to check if we are on the track
    const raycaster = new THREE.Raycaster();
    const downVector = new THREE.Vector3(0, -1, 0);
    const carOrigin = new THREE.Vector3();

    function checkOffroad() {
      carOrigin.copy(physics.position).setY(10); // Start ray from high up
      raycaster.set(carOrigin, downVector);
      
      // Raycast against the track group (which contains the road meshes)
      const intersects = raycaster.intersectObjects(trackGroup.children);
      return intersects.length === 0; // If we hit nothing, we are offroad
    }

    const carRadius = 1.5;
    function resolveWallCollisions() {
      let collided = false;
      const carPos = physics.position;
      const carBox3 = new THREE.Box3(
        new THREE.Vector3(carPos.x - carRadius, 0, carPos.z - carRadius),
        new THREE.Vector3(carPos.x + carRadius, 2, carPos.z + carRadius)
      );

      for (const wallBox of wallMeshes) {
        if (carBox3.intersectsBox(wallBox)) {
          collided = true;
          // Find center of wall and push car away
          const wallCenter = wallBox.getCenter(new THREE.Vector3());
          const pushDir = carPos.clone().sub(wallCenter).setY(0).normalize();
          
          // Push out
          physics.position.addScaledVector(pushDir, 2.0); // Push by 2 units
          physics.speed *= 0.2; // Lose most speed
        }
      }
      if (collided) car.position.copy(physics.position);
    }

    function updatePhysics(dt) {
      const forward = keys['KeyW'] || keys['ArrowUp'];
      const back    = keys['KeyS'] || keys['ArrowDown'];
      const left    = keys['KeyA'] || keys['ArrowLeft'];
      const right   = keys['KeyD'] || keys['ArrowRight'];
      const brake   = keys['Space'];

      physics.isOffroad = checkOffroad();
      const maxSpeed = physics.isOffroad ? OFFROAD_MAX_SPEED : BASE_MAX_SPEED;
      const accel = physics.isOffroad ? OFFROAD_ACCEL : ACCEL;

      if (forward) physics.speed += accel * dt;
      else if (back) {
        if (physics.speed > 0) physics.speed -= BRAKE * dt;
        else physics.speed -= accel * 0.6 * dt;
      }

      if (brake) physics.speed -= Math.sign(physics.speed) * BRAKE * dt;
      if (!forward && !back) {
        const d = DRAG * dt;
        if (Math.abs(physics.speed) <= d) physics.speed = 0;
        else physics.speed -= Math.sign(physics.speed) * d;
      }

      physics.speed = THREE.MathUtils.clamp(physics.speed, -REVERSE_SPEED, maxSpeed);

      const speedFactor = Math.min(Math.abs(physics.speed) / 6, 1);
      const highSpeedDamp = 1 - Math.min(Math.abs(physics.speed) / BASE_MAX_SPEED, 1) * 0.5;
      
      let targetSteer = 0;
      if (left)  targetSteer = 1;
      if (right) targetSteer = -1;
      physics.steer = THREE.MathUtils.lerp(physics.steer, targetSteer, 10 * dt);

      if (left)  physics.heading += TURN_RATE * speedFactor * highSpeedDamp * dt * Math.sign(physics.speed);
      if (right) physics.heading -= TURN_RATE * speedFactor * highSpeedDamp * dt * Math.sign(physics.speed);

      const dir = new THREE.Vector3(Math.sin(physics.heading), 0, Math.cos(physics.heading));
      physics.position.addScaledVector(dir, physics.speed * dt);

      resolveWallCollisions();

      car.position.copy(physics.position);
      car.rotation.y = physics.heading;
      car.rotation.z = -(physics.speed / BASE_MAX_SPEED) * physics.steer * 0.15;

      wheels[0].rotation.y = physics.steer * 0.5;
      wheels[1].rotation.y = physics.steer * 0.5;
    }

    // ---------- Checkpoints ----------
    function updateCheckpoints(dt) {
      const cp = checkpoints[currentCheckpoint];
      const dist = physics.position.distanceTo(cp.pos);

      if (dist < cp.r) {
        if (currentCheckpoint === 0) {
          if (hasStartedLap) {
            currentLapTime = (performance.now() - lapStartTime) / 1000;
            if (bestLapTime === null || currentLapTime < bestLapTime) {
              bestLapTime = currentLapTime;
              document.getElementById('best-time').textContent = bestLapTime.toFixed(2);
            }
          }
          hasStartedLap = true;
          lapStartTime = performance.now();
        }

        currentCheckpoint = (currentCheckpoint + 1) % checkpoints.length;
        cpVisuals.forEach((v, i) => {
          v.material.color.set(i === currentCheckpoint ? 0x00ff00 : (i === 0 ? 0xffaa00 : 0x00aaff));
        });
        document.getElementById('cp-count').textContent = 
          currentCheckpoint === 0 ? "Start Line" : `Checkpoint ${currentCheckpoint}`;
      }

      if (hasStartedLap) {
        currentLapTime = (performance.now() - lapStartTime) / 1000;
      }
    }

    // ---------- Camera ----------
    const camTarget = new THREE.Vector3();
    const camDesired = new THREE.Vector3();
    const CAM_HEIGHT   = 4;
    const CAM_LERP     = 5; 

    function updateCamera(dt) {
      const speedRatio = Math.abs(physics.speed) / BASE_MAX_SPEED;
      const distance = 8 + (speedRatio * 2); 
      
      const behind = new THREE.Vector3(-Math.sin(physics.heading), 0, -Math.cos(physics.heading));
      camDesired.copy(physics.position).addScaledVector(behind, distance).add(new THREE.Vector3(0, CAM_HEIGHT, 0));
      
      const t = 1 - Math.exp(-CAM_LERP * dt); 
      camera.position.lerp(camDesired, t);
      camTarget.copy(physics.position).add(new THREE.Vector3(0, 1, 0));
      camera.lookAt(camTarget);
    }

    // ---------- HUD ----------
    const speedEl = document.getElementById('speed');
    const lapTimeEl = document.getElementById('lap-time');
    const warningEl = document.getElementById('offroad-warning');

    function updateHUD() {
      speedEl.textContent = Math.round(Math.abs(physics.speed) * 3.6);
      lapTimeEl.textContent = currentLapTime.toFixed(2);
      warningEl.style.display = physics.isOffroad ? 'block' : 'none';
    }

    // ---------- Loop ----------
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      updatePhysics(dt);
      updateCheckpoints(dt);
      updateCamera(dt);
      updateHUD();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
